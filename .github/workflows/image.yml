name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # One nvcc at a time: a hosted runner has 2 cores and 7 GB, and a CUTLASS unit alone takes several.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - card: rtx3090
            arch: 86-real
          - card: rtx4090
            arch: 89-real
          - card: rtx5090
            arch: 120-real
    steps:
      # The image is over 10 GB; a runner starts with 14 GB free.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile's kernels cache mount, carried between runs: a changed lock then re-downloads
      # packages instead of recompiling comfy-kitchen and causal-conv1d for hours. About 1.6 GB a card.
      - id: kernels
        uses: actions/cache@v4
        with:
          path: kernels-cache
          key: kernels-${{ matrix.arch }}-${{ hashFiles('pixi.lock', 'toolchain.sh', 'ck-jobs.cmake') }}
          restore-keys: kernels-${{ matrix.arch }}-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "kernels-cache": {
                "target": "/root/.cache/rattler/cache",
                "id": "difflab-kernels-${{ matrix.arch }}"
              }
            }
          skip-extraction: ${{ steps.kernels.outputs.cache-hit }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/diverofdark/difflab
          tags: |
            type=raw,value=${{ matrix.card }}
            type=sha,prefix=${{ matrix.card }}-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            COMFY_CUDA_ARCHS=${{ matrix.arch }}
            MAX_JOBS=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The last image for this card is the layer cache: every layer is in it, so an unchanged
          # environment is pulled rather than rebuilt.
          cache-from: type=registry,ref=ghcr.io/diverofdark/difflab:${{ matrix.card }}
          cache-to: type=inline
