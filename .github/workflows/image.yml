name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Dockerfile's default, repeated because the kernels cache is named by it.
  ARCHS: 80-real;86-real;89;90a-real;100f;120f

jobs:
  build:
    runs-on: github-runner-difflab
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile's kernels cache mount, carried between runs: a changed lock then re-downloads
      # packages instead of recompiling comfy-kitchen and exllamav3 for hours.
      - id: kernels
        uses: actions/cache@v4
        with:
          path: kernels-cache
          key: kernels-all-${{ hashFiles('pixi.lock', 'toolchain.sh', 'ck-jobs.cmake') }}
          restore-keys: kernels-all-

      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "kernels-cache": {
                "target": "/root/.cache/rattler/cache",
                "id": "difflab-kernels-${{ env.ARCHS }}"
              }
            }
          skip-extraction: ${{ steps.kernels.outputs.cache-hit }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/diverofdark/difflab
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Six architectures per CUTLASS unit: two at a time inside each of six nvcc jobs keeps it to
          # twelve compilers.
          build-args: |
            COMFY_CUDA_ARCHS=${{ env.ARCHS }}
            MAX_JOBS=6
            NVCC_THREADS=2
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The last image is the layer cache: every layer is in it, so an unchanged environment is
          # referred to rather than rebuilt.
          cache-from: type=registry,ref=ghcr.io/diverofdark/difflab:latest
          cache-to: type=inline
