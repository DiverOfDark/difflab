name: desktop

# Manual only: the repository is private, and a macOS minute bills as ten.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The updater compares versions, so every build needs a higher one than the last.
  VERSION: 0.1.${{ github.run_number }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DiffLab desktop $VERSION" --notes "Built from $GITHUB_SHA." --latest
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/desktop-v$VERSION" --jq .id)" >> "$GITHUB_OUTPUT"

  bundle:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci
        working-directory: desktop

      - name: Stamp the version
        shell: bash
        run: |
          node -e 'const fs=require("fs"),f="desktop/src-tauri/tauri.conf.json",c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2))'

      # Each platform adds itself to the release's latest.json, which the app's updater reads.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.release.outputs.id }}

      - uses: actions/upload-artifact@v4
        with:
          name: difflab-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
